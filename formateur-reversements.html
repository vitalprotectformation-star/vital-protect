<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reversements — Vital Protect</title>
  <link rel="stylesheet" href="/styles/tokens.css"/>
  <link rel="stylesheet" href="/styles/base.css"/>
  <link rel="stylesheet" href="/styles/components.css"/>
  <link rel="icon" href="/favicon.ico"/>
  <style>

    /* ═══ LAYOUT MULTI-PAGES ════════════════════════════════════════════ */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    .vp-layout {
      display: flex;
      min-height: 100vh;
    }
    .vp-sidenav {
      width: 220px;
      flex-shrink: 0;
      background: #0b1e3d;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .vp-sidenav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .vp-sidenav-brand img { width: 36px; height: 36px; }
    .vp-sidenav-badge {
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      background: #1F3864;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }
    .vp-sidenav-label {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 20px 0 8px;
      padding: 0 4px;
    }
    .vp-sidenav-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .vp-sidenav-link {
      display: block;
      padding: 10px 14px;
      border-radius: 10px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .vp-sidenav-link:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .vp-sidenav-link.active { background: #1F3864; color: #fff; }
    .vp-sidenav-footer { margin-top: auto; padding-top: 20px; }
    .vp-sidenav-logout {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .vp-sidenav-logout:hover { background: rgba(255,0,0,0.1); color: #ff6b6b; }
    .vp-main-content {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      min-height: 100vh;
    }
    @media (max-width: 700px) {
      .vp-layout { flex-direction: column; }
      .vp-sidenav {
        width: 100%;
        height: auto;
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 12px 16px;
        gap: 8px;
      }
      .vp-sidenav-label, .vp-sidenav-footer { display: none; }
      .vp-sidenav-nav { flex-direction: row; flex-wrap: wrap; }
      .vp-sidenav-brand { margin-bottom: 0; }
      .vp-main-content { padding: 16px; }
    }


    :root {
      --navy: #0b2e59;
      --navy-dark: #08203d;
      --blue: #1f6feb;
      --blue-soft: #eaf2ff;
      --bg: #f4f7fb;
      --card: #ffffff;
      --border: #dbe4f0;
      --text: #142033;
      --muted: #667085;
      --success: #0f9d58;
      --warning: #b7791f;
      --danger: #c62828;
      --shadow: 0 10px 30px rgba(11, 46, 89, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, var(--navy-dark), var(--navy));
      color: white;
      padding: 16px 0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .brand img {
      height: 162px;
      width: auto;
      display: block;
    }

    .brand-text {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-links a,
    .nav-links button {
      color: rgba(255,255,255,0.92);
      text-decoration: none;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      transition: 0.2s ease;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-family: inherit;
    }

    .nav-links a:hover,
    .nav-links button:hover {
      background: rgba(255,255,255,0.12);
    }

    main {
      padding: 32px 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 20px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    p {
      line-height: 1.6;
    }

    .muted {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .info-box {
      background: #f8fbff;
      border: 1px solid #e5edf7;
      border-radius: 18px;
      padding: 18px;
    }

    .label {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .value {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .badge-success {
      background: #eaf8f0;
      color: var(--success);
    }

    .badge-warning {
      background: #fff4df;
      color: var(--warning);
    }

    .badge-danger {
      background: #fff1f1;
      color: var(--danger);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
    }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .alert {
      border-radius: 18px;
      padding: 18px;
      margin-top: 16px;
    }

    .alert-success {
      background: #eaf8f0;
      border: 1px solid #cdeedb;
      color: #0f7d46;
    }

    .alert-warning {
      background: #fff4df;
      border: 1px solid #f0d9a7;
      color: #8a5a00;
    }

    .alert-danger {
      background: #fff1f1;
      border: 1px solid #f2c7c7;
      color: #a32020;
    }

    .blocked {

    }

      background: #f8fbff;

    }

    .diagnostic {

    }

    .dashboard-header {

      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
    }

    .dashboard-kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .kpi-card {
      background: #f8fbff;
      border: 1px solid #e5edf7;
      border-radius: 18px;
      padding: 16px;
    }

    .kpi-label {

      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .kpi-value {

      font-weight: 900;
      color: var(--navy);
    }

    .dashboard-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    .dashboard-toolbar select {
      max-width: 260px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: white;
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #edf2f7;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #f8fbff;
    }

    td span {

      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .progress-track {
      width: 150px;
      height: 10px;

      background: #e8eef6;
      overflow: hidden;
      margin: 8px 0 4px;
    }

    .progress-fill {

      background: var(--blue);

      gap: 8px;
      flex-wrap: wrap;

      border-radius: 10px;
    }

      border-radius: 18px;
      padding: 20px;
      background: #fbfdff;
      color: var(--muted);
    }

    .stripe-connect-card {
      border: 1px solid var(--border);

      padding: 16px;
      background: #fbfdff;
      margin-top: 14px;
    }

      justify-content: space-between;

      flex-wrap: wrap;

    .stripe-connect-card ul {
      margin: 10px 0 0 18px;
      color: var(--muted);

    }

    .trainer-documents-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .trainer-document-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      color: #142033;
      min-width: 0;
    }

    .trainer-document-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .trainer-document-head h3 {
      margin: 0;
      font-size: 1.02rem;
      color: #142033;
      font-weight: 800;
    }

      padding: 10px;
      background: #ffffff;
      color: #223149;
      border-color: #cbd6e5;
    }

    .trainer-document-card input[type="file"]::file-selector-button {
      color: #111827;
    }

    .trainer-document-meta {
      color: #4f5f76;
      font-size: 0.9rem;
      margin: 8px 0 0;
    }

    .trainer-document-meta strong {
      color: #223149;
    }

    .trainer-document-card .field label {
      color: #35445a;
    }

    .trainer-document-note {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff4df;
      color: #8a5a00;
      font-size: 0.9rem;
    }

    .trainer-document-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .stage-details-panel {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      background: #fbfdff;
    }

    .stage-details-panel:empty {
      display: none;
    }

    .section-title {
      margin-bottom: 12px;
    }

    form {
      margin-top: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--muted);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.98rem;
      color: var(--text);
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-note {
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 8px;
    }

    footer {
      margin-top: 28px;
      background: var(--navy-dark);
      color: rgba(255,255,255,0.88);
      padding: 28px 0;
    }

    footer p {
      margin: 0;
      text-align: center;
    }

    /* V31 — anti-débordement textes/boutons */
    html, body { max-width: 100%; overflow-x: hidden; }
    .container, .header-inner, .brand, .nav-links, .grid, .grid-3, .actions, .card { min-width: 0; }
    .card, .card *, .info-box, .alert, .badge, .value, .muted, .form-note {
      max-width: 100%;
      min-width: 0;
      overflow-wrap: break-word;
      word-break: normal;
      hyphens: auto;
    }
    .btn, .nav-links a, .nav-links button, .badge {
      height: auto;
      white-space: normal;
      line-height: 1.25;
      text-align: center;
    }
    .brand-text { min-width: 0; overflow-wrap: break-word; }


    @media (max-width: 900px) {
      .grid,
      .grid-3,
      .dashboard-kpis,
      .trainer-documents-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .brand-text {
        font-size: 1.2rem;
      }

      .brand img {
        height: 132px;
      }

      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        width: 100%;
      }
    }

    .stripe-connect-card h1,

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const supabase = createClient(
      "https://zsraqxzneghkzaozzuci.supabase.co",
      "sb_publishable_VlTpYjzJ3DKpFA1Un_EFHQ_FW-mYK4U"
    );
    let certifiedModules = [];
    let dashboardStages = [];
    let dashboardReservations = [];
    let latestTrainerDashboard = null;
    let currentTrainer = null;

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }


    const VP_MODULE_NAMES = {
      module1: "Prévenir, éviter, réagir – Module 1",
      module2: "Prévenir, éviter, réagir – Module 2",
      pro: "Faire face aux situations tendues et comportements agressifs en milieu professionnel"
    };

    function normalizeModuleKey(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function getCanonicalModuleType(...values) {
      const text = values.map(normalizeModuleKey).filter(Boolean).join(" ");
      if (!text) return "";
      if (text.includes("niveau 2") || text.includes("niv 2") || text.includes("module 2")) return "module2";
      if (text.includes("professionnel") || text.includes("professionnelle") || text.includes("entreprise") || text.includes("salarie") || text.includes("salaries") || text.includes("equipe") || text.includes("agressif") || text.includes("agressive") || text.includes("tendu") || text.includes("tendue") || text.includes("comportement") || text.includes("self pro")) return "pro";
      if (text.includes("niveau 1") || text.includes("niv 1") || text.includes("module 1") || text.includes("self defense") || text.includes("securite personnelle") || text.includes("prevenir eviter reagir")) return "module1";
      return "";
    }

    function getCanonicalModuleName(value) {
      const type = getCanonicalModuleType(value);
      return type ? VP_MODULE_NAMES[type] : String(value || "").trim();
    }


    function getOfficialModuleName(value) {
      const type = getCanonicalModuleType(value);
      return type ? VP_MODULE_NAMES[type] : "";
    }

    function isOfficialModuleName(value) {
      return Boolean(getOfficialModuleName(value));
    }

    function pushOfficialModule(modules, value) {
      const moduleName = getOfficialModuleName(value);
      if (!moduleName) return;
      const key = normalizeModuleKey(moduleName);
      if (!modules.some(existing => normalizeModuleKey(existing) === key)) {
        modules.push(moduleName);
      }
    }

    function extractOfficialModulesFromText(value) {
      const raw = String(value || "").trim();
      if (!raw) return [];

      let items = [];
      if (raw.startsWith("[") && raw.endsWith("]")) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) items = parsed;
        } catch (_) {
          items = [];
        }
      }

      if (!items.length) {
        items = raw.split(/\s*\|\s*|\s*;\s*|\n+/g);
      }

      const modules = [];
      items.forEach(item => pushOfficialModule(modules, item));

      const normalized = normalizeModuleKey(raw);
      if (normalized.includes("module 1") || normalized.includes("niveau 1")) pushOfficialModule(modules, VP_MODULE_NAMES.module1);
      if (normalized.includes("module 2") || normalized.includes("niveau 2")) pushOfficialModule(modules, VP_MODULE_NAMES.module2);
      if (
        normalized.includes("professionnel") ||
        normalized.includes("professionnelle") ||
        normalized.includes("entreprise") ||
        normalized.includes("salarie") ||
        normalized.includes("salaries") ||
        normalized.includes("equipe") ||
        normalized.includes("agressif") ||
        normalized.includes("agressive") ||
        normalized.includes("tendu") ||
        normalized.includes("tendue") ||
        normalized.includes("comportement") ||
        normalized.includes("self pro") ||
        normalized.includes("module 3") ||
        normalized.includes("mod 3")
      ) pushOfficialModule(modules, VP_MODULE_NAMES.pro);

      return modules.slice(0, 3);
    }

    function replaceLegacyModuleNames(value) {
      let text = String(value || "").trim();
      if (!text) return "";
      text = text.replace(/Self\s*Défense\s*en\s*entreprise/gi, VP_MODULE_NAMES.pro);
      text = text.replace(/Self\s*Defense\s*en\s*entreprise/gi, VP_MODULE_NAMES.pro);
      text = text.replace(/Self\s*Pro/gi, VP_MODULE_NAMES.pro);
      text = text.replace(/Self\s*Défense\s*Essentielle\s*Niveau\s*2/gi, VP_MODULE_NAMES.module2);
      text = text.replace(/Self\s*Defense\s*Essentielle\s*Niveau\s*2/gi, VP_MODULE_NAMES.module2);
      text = text.replace(/Self\s*Défense\s*Essentielle\s*Niveau\s*1/gi, VP_MODULE_NAMES.module1);
      text = text.replace(/Self\s*Defense\s*Essentielle\s*Niveau\s*1/gi, VP_MODULE_NAMES.module1);
      text = text.replace(/Self\s*Défense\s*Essentielle/gi, VP_MODULE_NAMES.module1);
      text = text.replace(/Self\s*Defense\s*Essentielle/gi, VP_MODULE_NAMES.module1);
      return text;
    }

    function displayStageTitle(stage) {
      const moduleName = getCanonicalModuleName(stage?.training_type || stage?.title);
      const title = replaceLegacyModuleNames(stage?.title || "");
      if (title && title !== stage?.title) return title;
      if (title && normalizeModuleKey(title).includes(normalizeModuleKey(moduleName))) return title;
      return moduleName || title || "Stage";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function formatDate(dateString) {
      if (!dateString) return "—";
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleDateString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatDateTime(dateString) {
      if (!dateString) return "—";
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatPrice(value) {

      return new Intl.NumberFormat("fr-FR", {

    function isPastStage(dateString) {

      const today = new Date();
      today.setHours(0, 0, 0, 0);

    function reservationsForStage(stageId) {
      return dashboardReservations.filter(row => row.stage_id === stageId);
    }

    function paidReservationsForStage(stageId) {
      return reservationsForStage(stageId).filter(row => normalize(row.payment_status || "paid") === "paid");
    }

    function isEnterpriseStage(stage) {
      return normalize(stage?.stage_kind || stage?.price_model) === "enterprise" || normalize(stage?.stage_kind || stage?.price_model) === "package" || Number(stage?.standard_price || 0) === 390;
    }

    function paidPlacesForStage(stageId) {
      const stage = dashboardStages.find(item => item.id === stageId);
      const reservations = paidReservationsForStage(stageId);
      if (isEnterpriseStage(stage)) return reservations.length;
      return reservations.reduce((sum, row) => sum + Number(row.places || 0), 0);
    }

    function getReservationTrainerPayout(row) {
      if (!row || row.trainer_payout_amount === null || row.trainer_payout_amount === undefined || row.trainer_payout_amount === "") {
        return null;
      }

      const amount = Number(row.trainer_payout_amount);
      return Number.isFinite(amount) ? amount : null;
    }

    function getReservationGrossAmount(row) {
      if (!row || row.trainer_payout_gross_amount === null || row.trainer_payout_gross_amount === undefined || row.trainer_payout_gross_amount === "") {
        return null;
      }
      const amount = Number(row.trainer_payout_gross_amount);
      return Number.isFinite(amount) ? amount : null;
    }

    function getReservationCommissionAmount(row) {
      if (row && row.vital_protect_commission_amount !== null && row.vital_protect_commission_amount !== undefined && row.vital_protect_commission_amount !== "") {
        const stored = Number(row.vital_protect_commission_amount);
        if (Number.isFinite(stored)) return stored;
      }
      const gross = getReservationGrossAmount(row);
      const payout = getReservationTrainerPayout(row);
      if (gross === null || payout === null) return null;
      return Math.max(0, Math.round((gross - payout) * 100) / 100);
    }

    function payoutSummaryForStage(stageId) {
      const reservations = paidReservationsForStage(stageId);
      if (reservations.length) {
        let total = 0;
        for (const row of reservations) {
          const amount = getReservationTrainerPayout(row);
          if (amount === null) {
            return { known: false, amount: null };
          }
          total += amount;
        }
        return { known: true, amount: total };
      }

      const stage = dashboardStages.find(item => item.id === stageId);
      const stageAmount = Number(stage?.trainer_payout_estimate);
      if (Number.isFinite(stageAmount)) {
        return { known: true, amount: stageAmount };
      }

      return { known: true, amount: 0 };
    }

    function trainerPayoutStatusClass(status) {

      if (value === "blocked") return "badge-danger";

    function reservationPayoutStatus(row) {
      if (row?.trainer_payout_transferred_at || row?.trainer_payout_paid_at || row?.trainer_payout_stripe_transfer_id) return "paid";
      return normalize(row?.trainer_payout_status || "scheduled");
    }

    function aggregateTrainerPayoutStatus(reservations) {
      const rows = (reservations || []).filter(row => normalize(row.payment_status || "paid") === "paid");
      if (!rows.length) return "scheduled";
      const statuses = rows.map(reservationPayoutStatus);
      if (statuses.every(status => status === "paid")) return "paid";
      if (statuses.some(status => status === "blocked")) return "blocked";
      if (statuses.some(status => status === "validated")) return "validated";
      return "scheduled";
    }

    function formatCommissionRate(row, stage) {
      const rate = Number(row?.vital_protect_commission_rate ?? stage?.vital_protect_commission_rate ?? stats.commission_rate ?? 0);
      if (!Number.isFinite(rate)) return "—";
      return `${Math.round(rate * 1000) / 10}%`;

    function shortStripeId(value) {
      const id = String(value || "").trim();
      if (!id) return "";
      if (id.length <= 18) return id;
      return `${id.slice(0, 10)}…${id.slice(-6)}`;
    }

    function buildTrainerPayoutRows() {
      return dashboardStages
        .map(stage => {
          const reservations = paidReservationsForStage(stage.id);
          const summary = payoutSummaryForStage(stage.id);
          const status = aggregateTrainerPayoutStatus(reservations);
          const dueDate = reservations.find(row => row.trainer_payout_due_date)?.trainer_payout_due_date || stage.trainer_payout_due_date;
          const paidAt = reservations.find(row => row.trainer_payout_transferred_at)?.trainer_payout_transferred_at || reservations.find(row => row.trainer_payout_paid_at)?.trainer_payout_paid_at || null;
          const transferIds = reservations
            .map(row => String(row.trainer_payout_stripe_transfer_id || "").trim())
            .filter(Boolean);

          const totalGrossFromReservations = reservations.reduce((sum, row) => sum + Number(getReservationGrossAmount(row) || 0), 0);
          const totalPayoutFromReservations = reservations.reduce((sum, row) => sum + Number(getReservationTrainerPayout(row) || 0), 0);
          const totalCommissionFromReservations = reservations.reduce((sum, row) => sum + Number(getReservationCommissionAmount(row) || 0), 0);

          const stageGross = Number(stage.trainer_payout_gross_estimate);
          const stageCommission = Number(stage.vital_protect_commission_estimate);

          return {
            stage,
            reservations,
            summary,
            status,
            dueDate,
            paidAt,
            transferIds,
            gross: totalGrossFromReservations || (Number.isFinite(stageGross) ? stageGross : null),
            commission: totalCommissionFromReservations || (Number.isFinite(stageCommission) ? stageCommission : null),
            payout: totalPayoutFromReservations || Number(summary.amount || 0)
          };
        })
        .filter(row => row.reservations.length || Number(row.summary.amount || 0) > 0)
        .sort((a, b) => {
          const weight = { validated: 0, scheduled: 1, pending: 1, blocked: 2, paid: 3 };
          const byStatus = (weight[a.status] ?? 1) - (weight[b.status] ?? 1);
          if (byStatus) return byStatus;
          return String(a.dueDate || "9999-12-31").localeCompare(String(b.dueDate || "9999-12-31")) || String(a.stage.stage_date || "").localeCompare(String(b.stage.stage_date || ""));
        });
    }

    async function retakeModule(btn) {
      const moduleName = btn.dataset.module;
      if (!moduleName) return;

      const confirmed = window.confirm('Racheter le module "' + moduleName + '" pour 245 € ?');
      if (!confirmed) return;

      btn.disabled = true;
      btn.textContent = "Redirection...";

      try {
        const sessionData = await supabase.auth.getSession();
        const email = sessionData.data.session?.user?.email || "";

        if (!email) {
          alert("Session expirée. Veuillez vous reconnecter.");
          window.location.href = "/formateur-login.html";
          return;
        }

        const res = await fetch("/api/create-trainer-checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, retake_module: moduleName })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || "Erreur serveur (" + res.status + ")");
        }

        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || "URL de paiement introuvable");
        }
      } catch (e) {
        console.error("retakeModule error:", e);
        alert("Erreur : " + (e.message || "Veuillez réessayer."));
        btn.disabled = false;
        btn.textContent = "Racheter ce module";
      }
    }

    function formatTrainerPayout(summary) {
      if (!summary || summary.known === false || summary.amount === null || summary.amount === undefined) {

    function getStageCapacity(stage) {
      const apiCapacity = Number(stage.inventory_capacity || 0);
      if (apiCapacity > 0) return apiCapacity;
      if (isEnterpriseStage(stage)) return Number(stage.remaining_places || 0) + paidPlacesForStage(stage.id) || 1;
      const maxParticipants = Number(stage.max_participants || 0);
      if (maxParticipants > 0) return maxParticipants;
      return Number(stage.remaining_places || 0) + paidPlacesForStage(stage.id);
    }

    function getFillPercent(stage) {
      const capacity = getStageCapacity(stage);
      if (!capacity) return 0;
      return Math.min(100, Math.round((paidPlacesForStage(stage.id) / capacity) * 100));
    }

    function isFutureOrToday(dateString) {
      if (!dateString) return false;

      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return false;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      date.setHours(0, 0, 0, 0);
      return date >= today;
    }

    async function getTrainerAuthHeaders() {
      let {
        data: { session }
      } = await supabase.auth.getSession();

      if (!session?.access_token) {
        await new Promise(resolve => setTimeout(resolve, 500));
        const retry = await supabase.auth.getSession();
        session = retry.data.session;
      }

      const accessToken = session?.access_token || "";

      if (!accessToken) {
        throw new Error("Session formateur introuvable");
      }

      return {
        "Content-Type": "application/json",
        Authorization: `Bearer ${accessToken}`
      };
    }

    async function parseApiResponse(res) {
      const rawText = await res.text();
      let data = null;

      try {
        data = rawText ? JSON.parse(rawText) : {};
      } catch (error) {
        data = { error: rawText || `Réponse non JSON (${res.status})` };
      }

      if (!res.ok) {
        throw new Error(data?.error || `Erreur HTTP ${res.status}`);
      }

      return data;
    }

    async function loadCertifiedModules(trainer) {
      const { data: trainerModules, error } = await supabase
        .from("trainer_modules")
        .select("module_name, status, expires_at")
        .eq("trainer_id", trainer.id);

      if (error) {
        console.error("Erreur chargement trainer_modules:", error);
        return [];
      }

      const seen = new Set();
      return (trainerModules || [])
        .filter(item =>
          ["certified", "active"].includes(normalize(item.status || "certified")) &&
          isFutureOrToday(item.expires_at) &&
          isOfficialModuleName(item.module_name)
        )
        .map(item => getOfficialModuleName(item.module_name))
        .filter(moduleName => {
          const key = normalizeModuleKey(getCanonicalModuleName(moduleName));
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function exportStageReservations(stageId) {
      const stage = dashboardStages.find(item => item.id === stageId);
      const reservations = paidReservationsForStage(stageId);

      if (!stage || !reservations.length) {
        alert("Aucun inscrit à exporter pour ce stage.");
        return;
      }

      const rows = [
        ["Stage", "Date", "Prénom", "Nom", "Email", "Téléphone", "Places", "Versement Vital Protect estimé", "Paiement", "Inscription"],
        ...reservations.map(row => [
          displayStageTitle(stage),
          formatDate(stage.stage_date),
          row.first_name || "",
          row.last_name || "",
          row.email || "",
          row.phone || "",
          row.places || 0,
          getReservationTrainerPayout(row) ?? "À définir",
          row.payment_status || "paid",
          formatDateTime(row.created_at)
        ])
      ];

      const csv = rows
        .map(cols => cols.map(value => `"${String(value).replace(/"/g, '""')}"`).join(";"))
        .join("\n");

      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `inscrits-${(displayStageTitle(stage) || "stage").toLowerCase().replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "")}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function updateTrainerStageStatus(stageId, status) {
      const label = status === "cancelled" ? "annuler" : "publier";
      if (!window.confirm(`Confirmer : ${label} ce stage ?`)) return;

      try {
        const headers = await getTrainerAuthHeaders();
        const res = await fetch("/api/trainer-tools", {
          method: "POST",
          headers,
          body: JSON.stringify({
            action: "update_stage_status",
            stage_id: stageId,
            status
          })
        });

        const result = await parseApiResponse(res);
        if (!result.success) {
          alert(result.error || "Mise à jour impossible.");
          return;
        }

        await refreshTrainerDashboard();
      } catch (error) {
        console.error(error);
        alert(error.message || "Erreur lors de la mise à jour du stage.");
      }

    async function handleCreateStageSubmit() {
      const form = document.getElementById("createStageForm");
      const statusBox = document.getElementById("createStageStatus");

      if (!form || !statusBox) return;

      window.VP_FRANCE_LOCATION?.setupRegionDepartment({
        regionId: "stageRegion",
        departmentId: "stageDepartment",
        regionPlaceholder: "Sélectionner une région",
        departmentPlaceholder: "Sélectionner un département",
        includeAllDepartmentsWhenNoRegion: false
      });
      window.VP_FRANCE_LOCATION?.setupPostalCode("stagePostalCode");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        statusBox.style.display = "block";
        statusBox.textContent = "Création du stage en cours...";

        const trainingType = document.getElementById("stageTrainingType").value;
        const city = document.getElementById("stageCity").value.trim();
        const stageDate = document.getElementById("stageDate").value;

        if (!certifiedModules.includes(trainingType)) {
          statusBox.textContent = "Erreur : ce module n’est pas autorisé pour votre profil.";
          return;
        }

        if (!stageDate) {
          statusBox.textContent = "Erreur : veuillez choisir une date.";
          return;
        }

        const payload = {
          action: "create_stage",
          training_type: trainingType,
          description: document.getElementById("stageDescription").value.trim(),
          city,
          postal_code: document.getElementById("stagePostalCode").value.trim(),
          department: document.getElementById("stageDepartment").value.trim(),
          region: document.getElementById("stageRegion").value.trim(),
          address: document.getElementById("stageAddress").value.trim(),
          stage_date: document.getElementById("stageDate").value,
          start_time: document.getElementById("stageTime").value.trim(),
          duration: document.getElementById("stageDuration").value.trim(),
          max_participants: Number(document.getElementById("stageMaxParticipants").value || 20),
          remaining_places: Number(document.getElementById("stageRemainingPlaces").value || 20),
          // Le prix n’est pas choisi par le formateur : il est standardisé côté serveur.
        };

        try {
          const headers = await getTrainerAuthHeaders();

          const res = await fetch("/api/trainer-tools", {
            method: "POST",
            headers,
            body: JSON.stringify(payload)
          });

          const result = await parseApiResponse(res);

          if (!result.success) {
            statusBox.textContent = result.error || "Erreur lors de la création du stage.";
            return;
          }

          statusBox.textContent = `✅ ${result.message || "Stage créé et publié avec succès."} Titre généré : ${result.stage?.title || "Stage"}`;
          form.reset();
          await refreshTrainerDashboard();
        } catch (error) {
          console.error("Erreur création stage:", error);
          statusBox.textContent = `Erreur : ${escapeHtml(error.message)}`;
        }
      });
    }

    function candidateStatusLabel(candidate) {
      const payment = normalize(candidate?.payment_status || "");
      const validation = normalize(candidate?.validation_status || "pending");
      const result = normalize(candidate?.training_result || "pending");

      if (["captured", "paid"].includes(payment) && validation === "validated" && result === "passed") return "Réussi — activation à finaliser";
      if (result === "resit") return "Rattrapage à planifier";
      if (result === "failed") return "Recalé";
      if (validation === "validated") return "Dossier validé — vous recevrez un email dès que vos sessions sont planifiées";
      if (["authorized", "captured", "paid", "checkout_created"].includes(payment)) return "Votre dossier est en cours d'examen par notre équipe. Vous recevrez un email de confirmation dès validation. Vous pourrez ensuite vous inscrire sur une date de formation.";
      return "Dossier en cours de traitement";
    }

    function groupCandidateSessionsByModule(sessions = []) {
      return sessions.reduce((groups, session) => {
        const moduleName = getOfficialModuleName(session.module_name || session.training_type || session.title || "Module");
        if (!moduleName) return groups;
        if (!groups[moduleName]) groups[moduleName] = [];
        groups[moduleName].push({ ...session, module_name: moduleName, title: moduleName });
        return groups;
      }, {});
    }

    function getCandidateSessionVisual(moduleName) {
      const type = getCanonicalModuleType(moduleName);
      if (type === "pro") return "vp-exact-self-pro.png";
      return "vp-exact-prevenir-module.png";
    }

    function getCandidateModuleCardClass(moduleName) {
      const type = getCanonicalModuleType(moduleName);
      if (type === "pro") return "candidate-stage-card-pro";
      if (type === "module2") return "candidate-stage-card-module2";
      return "candidate-stage-card-module1";
    }

    function getCleanCandidateModules(candidate = {}) {
      const modules = [];
      const selected = Array.isArray(candidate.selected_modules) ? candidate.selected_modules : [];
      selected.forEach(moduleName => pushOfficialModule(modules, moduleName));

      // Sécurité : si d'anciennes données ont été découpées sur les virgules
      // (ex. "Prévenir" / "éviter" / "réagir – Module 1"), on reconstruit
      // uniquement les 3 modules officiels à partir du texte complet disponible.
      [
        selected.join(" | "),
        candidate.training_type,
        candidate.selected_module,
        candidate.message
      ].forEach(value => {
        extractOfficialModulesFromText(value).forEach(moduleName => pushOfficialModule(modules, moduleName));
      });

      return modules.slice(0, 3);
    }

    function normalizeCandidateModuleSessions(value) {
      if (!value) return {};
      if (typeof value === "string") {
        try {
          value = JSON.parse(value);
        } catch (_) {
          return {};
        }
      }
      if (typeof value !== "object" || Array.isArray(value)) return {};

      const normalized = {};
      Object.entries(value).forEach(([key, rawEntry]) => {
        const entry = rawEntry && typeof rawEntry === "object" && !Array.isArray(rawEntry) ? rawEntry : {};
        const moduleName = getOfficialModuleName(key) || getOfficialModuleName(entry.module_name) || getOfficialModuleName(entry.title);
        if (!moduleName) return;
        const status = normalize(entry.status || entry.candidate_session_status || "not_selected");
        normalized[moduleName] = {
          module_name: moduleName,
          session_id: String(entry.session_id || entry.id || "").trim(),
          status: ["not_selected", "session_requested", "session_confirmed", "session_declined"].includes(status) ? status : "not_selected",
          requested_at: entry.requested_at || entry.candidate_session_requested_at || null,
          confirmed_at: entry.confirmed_at || entry.candidate_session_confirmed_at || null,
          admin_note: entry.admin_note || entry.candidate_session_admin_note || ""
        };
      });

      return normalized;
    }

    function getCandidateModuleSession(candidate = {}, moduleName = "") {
      const officialModuleName = getOfficialModuleName(moduleName) || getCanonicalModuleName(moduleName);
      const moduleSessions = normalizeCandidateModuleSessions(candidate.candidate_module_sessions);
      const entry = moduleSessions[officialModuleName];
      if (entry && entry.session_id) return entry;

      // Compatibilité anciennes données : session_id global.
      if (candidate.session_id && !entry) {
        return {
          module_name: officialModuleName,
          session_id: candidate.session_id,
          status: candidate.candidate_session_status || "session_requested",
          requested_at: candidate.candidate_session_requested_at || null,
          confirmed_at: candidate.candidate_session_confirmed_at || null,
          admin_note: candidate.candidate_session_admin_note || ""
        };
      }

      return null;
    }

    function formatCandidateDateRange(startDate, endDate) {
      const start = formatDate(startDate);
      const end = formatDate(endDate);
      if (start === "—" && end === "—") return "Date à confirmer";
      if (end === "—" || start === end) return start;
      return `${start} → ${end}`;
    }

    function getCandidateSessionStatus(candidate = {}, moduleName = "") {
      if (moduleName) {
        const moduleSession = getCandidateModuleSession(candidate, moduleName);
        if (!moduleSession?.session_id) return "not_selected";
        return moduleSession.status || "session_requested";
      }
      const moduleSessions = normalizeCandidateModuleSessions(candidate.candidate_module_sessions);
      const entries = Object.values(moduleSessions).filter(entry => entry && entry.session_id);
      if (entries.length) {
        if (entries.some(entry => entry.status === "session_requested")) return "session_requested";
        if (entries.some(entry => entry.status === "session_declined")) return "session_declined";
        if (entries.every(entry => entry.status === "session_confirmed")) return "session_confirmed";
      }
      if (!candidate.session_id) return "not_selected";
      return candidate.candidate_session_status || "session_requested";
    }

    function getCandidateSessionStatusText(candidate = {}, moduleName = "") {
      const status = normalize(getCandidateSessionStatus(candidate, moduleName));
      if (status === "session_confirmed") return "Session confirmée par VITAL PROTECT";
      if (status === "session_declined") return "Session refusée — VITAL PROTECT vous proposera une autre date";
      if (status === "session_requested") return "Session souhaitée — en attente de confirmation VITAL PROTECT";
      return "Aucune session choisie";
    }

          button: "Préférer cette session",
          note: "Votre demande sera envoyée à VITAL PROTECT pour confirmation.",

        disabled: true,
        className: " candidate-stage-card-requested"
      };
    }

                      const cardState = getCandidateSessionCardText(candidate, Boolean(isSelected), canonicalModuleName);
                      return `
                        <article class="candidate-stage-card ${cardClass}${isSelected ? " candidate-stage-card-selected" : ""}${cardState.className}" style="--candidate-card-bg:url('${escapeAttr(cardImage)}')">
                          <div class="candidate-stage-card-image" aria-hidden="true"></div>
                          <div class="candidate-stage-card-overlay">
                            <div class="candidate-stage-card-top">
                              <span class="candidate-stage-kicker">Module financé</span>
                              <span class="candidate-stage-status">${escapeHtml(cardState.badge)}</span>
                            </div>
                            <h4>${escapeHtml(canonicalModuleName)}</h4>
                            <p class="candidate-stage-location">${escapeHtml(locationLabel)}</p>
                            <div class="candidate-stage-chips">
                              <span>${escapeHtml(formatCandidateDateRange(session.start_date, session.end_date))}</span>
                              <span>${escapeHtml(durationLabel)}</span>
                              <span>${escapeHtml(placesLabel)} place${remaining === 1 ? "" : "s"}</span>
                            </div>
                            <button class="candidate-stage-action candidate-session-prefer" type="button" data-session-id="${escapeAttr(session.id || "")}" data-module-name="${escapeAttr(canonicalModuleName)}" data-session-label="${escapeAttr(`${canonicalModuleName} — ${locationLabel} — ${formatDate(session.start_date)}`)}" ${cardState.disabled ? "disabled" : ""}>
                              ${escapeHtml(cardState.button)}
                            </button>
                            <small>${escapeHtml(cardState.note)}</small>
                          </div>
                        </article>
                      `;
                    }).join("")}
                  </div>
                ` : `
                  <div class="candidate-empty-session">
                    <strong>Aucune session ouverte pour ce module actuellement.</strong>
                    <span>VITAL PROTECT vous proposera une prochaine date ou vous recontactera dès l’ouverture d’une session.</span>
                  </div>
                `}
              </section>
            `;
          }).join("")}
        </div>
      `;
    }

    function attachCandidateSessionActions() {
      document.querySelectorAll(".candidate-session-prefer").forEach((button) => {
        button.addEventListener("click", async () => {
          if (button.disabled) return;

          const sessionId = button.dataset.sessionId || "";
          const label = button.dataset.sessionLabel || "session de validation";
          const moduleName = button.dataset.moduleName || "";

          if (!sessionId) {
            alert("Session introuvable. Rechargez la page puis réessayez.");
            return;
          }

          if (!window.confirm(`Confirmer votre préférence pour :\n${label} ?`)) return;

          const previousText = button.textContent;
          button.disabled = true;
          button.textContent = "Enregistrement...";

          try {
            const headers = await getTrainerAuthHeaders();
            const res = await fetch("/api/trainer-tools", {
              method: "POST",
              headers,
              body: JSON.stringify({
                action: "prefer_candidate_session",
                session_id: sessionId,
                module_name: moduleName
              })
            });

            const result = await parseApiResponse(res);
            alert(result.message || "Votre préférence de session est enregistrée.");
            await refreshTrainerDashboard();
          } catch (error) {
            console.error(error);
            alert(error.message || "Impossible d’enregistrer votre choix de session.");
            button.disabled = false;
            button.textContent = previousText;
          }
        });
      });
    }

    function renderCandidateDashboard(data, sessionEmail) {
      const candidate = data?.candidate || {};
      const modules = getCleanCandidateModules(candidate);
      const price = Number(candidate.trainer_formula_price || 0);
      const count = Number(candidate.trainer_formula_module_count || modules.length || 1);
      const app = document.getElementById("app");

      app.innerHTML = `
        <h1>Dashboard formateur</h1>
        <p class="muted">Votre espace est ouvert. Certaines fonctionnalités seront débloquées après validation et activation par VITAL PROTECT.</p>

        <div class="alert alert-warning">
          <h2>Dossier en cours d'examen</h2>
          <p>${escapeHtml(candidateStatusLabel(candidate))}</p>
          <p style="margin-top:8px;font-size:13px;opacity:0.85">Un email vous sera envoyé automatiquement dès que votre dossier sera validé par notre équipe.</p>
        </div>

        <div class="grid" style="margin-top:18px;">
          <div class="info-box">
            <span class="label">Candidat</span>
            <div class="value">${escapeHtml(candidate.first_name || "")} ${escapeHtml(candidate.last_name || "")}</div>
          </div>
          <div class="info-box">
            <span class="label">Email</span>
            <div class="value">${escapeHtml(candidate.email || sessionEmail || "—")}</div>
          </div>
          <div class="info-box">
            <span class="label">Formule</span>
            <div class="value">${count} module${count > 1 ? "s" : ""}${price ? ` — ${formatPrice(price)}` : ""}</div>
          </div>
          <div class="info-box">
            <span class="label">Statut</span>
            <div class="value"><span class="badge badge-warning">En attente d’activation</span></div>
          </div>
        </div>

        <div class="card" style="padding:18px; margin-top:18px;">
          <h2 class="section-title">Mes modules financés</h2>
          ${modules.length ? `
            <div class="grid">
              ${modules.map(moduleName => `
                <div class="info-box">
                  <span class="label">Module</span>
                  <div class="value">${escapeHtml(getCanonicalModuleName(moduleName))}</div>
                </div>
              `).join("")}
            </div>
          ` : `<p class="muted">Aucun module retrouvé. Contactez VITAL PROTECT si le problème persiste.</p>`}
        </div>

        ${buildStripeConnectSection(data)}

        ${buildTrainerDocumentsSection(data)}

        ${buildCandidateSessionsSection(data)}

        <div class="card" style="padding:18px; margin-top:18px;">
          <h2 class="section-title">Fonctionnalités verrouillées</h2>
          <p class="muted">La création de stages, la liste des inscrits et les reversements seront disponibles après réussite du parcours et activation de votre profil formateur.</p>
          <div class="actions">
            <a href="mailto:contact@vital-protect.fr" class="btn btn-primary">Contacter VITAL PROTECT</a>
            <button id="logoutBtn" class="btn btn-secondary" type="button">Déconnexion</button>
          </div>
        </div>

        <div class="debug diagnostic">Email session : ${escapeHtml(sessionEmail)}
Statut dashboard : candidat formateur
ID candidat : ${escapeHtml(candidate.id || "—")}</div>
      `;

      attachLogoutButtons();
      attachStripeConnectActions();
      attachTrainerDocumentActions();
      attachCandidateSessionActions();
    }



    function buildVpCommissionBlock() {
      const data = window._dashboardData || {};
      const stats = data.stats || {};
      const realized = stats.stages_realized_12_months || 0;
      const shareRate = stats.trainer_share_rate || 0.70;
      const label = stats.commission_label || "Lancement";
      const nextPayout = stats.next_payout_day || 20;
      const tiers = [
        { name: "Lancement", rate: "70 %", cond: "0–5 stages / an", active: realized < 6 },
        { name: "Régulier",  rate: "85 %", cond: "6–11 stages / an", active: realized >= 6 && realized < 12 },
        { name: "Mensuel",   rate: "92,5 %", cond: "12+ stages / an", active: realized >= 12 },
      ];
      return `<div class="vp-commission-block">
        <div class="vp-commission-current">
          <div class="vp-commission-label">${escapeHtml(label)}</div>
          <div class="vp-commission-rate">${Math.round(shareRate * 100)}&nbsp;% du prix HT</div>
          <div class="vp-commission-sub">${realized} stage${realized !== 1 ? "s" : ""} réalisé${realized !== 1 ? "s" : ""} sur 12 mois · Reversement le ${nextPayout} du mois suivant</div>
        </div>
        <div class="vp-commission-tiers">
          ${tiers.map(t => `<div class="vp-commission-tier ${t.active ? "is-active" : ""}">
            <span class="vp-tier-name">${t.name}</span>
            <span class="vp-tier-rate">${t.rate}</span>
            <span class="vp-tier-cond">${t.cond}</span>
          </div>`).join("")}
        </div>
      </div>`;
    }

    function buildVpReversementsPanel() {
      const rows = buildTrainerPayoutRows();
      if (!rows || !rows.length) {
        return `<div class="card" style="padding:24px">
          <h2 class="section-title">Reversements</h2>
          <p class="muted" style="margin-top:12px">Aucun reversement pour le moment.</p>
        </div>`;
      }
      return `<div class="card" style="padding:18px">${buildTrainerPayoutsSection()}</div>`;
    }

    async function buildTrainerView(trainer, sessionEmail) {
      currentTrainer = trainer;
      const certValid = isFutureOrToday(trainer.certification_expiry);
      const affiliationValid = isFutureOrToday(trainer.affiliation_end) && normalize(trainer.affiliation_status) === "active";
      if (!affiliationValid || !certValid) {
        const app = document.getElementById("app");
        const affiliationFeedback = buildAffiliationFeedback();
        app.innerHTML = `<div class="alert alert-warning">
          <h2>${affiliationValid ? "Habilitation expirée" : "Affiliation expirée"}</h2>
          <p>Veuillez contacter Vital Protect pour renouveler votre accès.</p>
        </div>`;
        attachLogoutButtons();
        return;
      }
      // Load certified modules
      try { certifiedModules = await loadCertifiedModules(trainer); } catch(e) { certifiedModules = []; }
      await renderFullActiveView(trainer, sessionEmail, certValid, affiliationValid);
    }

    async function renderFullActiveView(trainer, sessionEmail, certValid, affiliationValid) {
      const app = document.getElementById("app");
      try { await loadTrainerDashboardData(); } catch(e) {}

      app.innerHTML = `
        <div class="vp-page-header"><div>
          <h1 class="vp-page-title">Reversements</h1>
          <p class="vp-page-subtitle">Historique de vos paiements</p>
        </div></div>
        ${buildVpReversementsPanel()}
      `;
      attachLogoutButtons();
    }

    async function load() {
      const app = document.getElementById("app");
      let { data: { session } } = await supabase.auth.getSession();
      if (!session?.user?.email) {
        await new Promise(r => setTimeout(r, 1000));
        const retry = await supabase.auth.getSession();
        session = retry.data.session;
      }
      if (!session?.user?.email) { window.location.href = "/formateur-login.html"; return; }
      const sessionEmail = session.user.email.trim().toLowerCase();
      try {
        const dashboardData = await loadTrainerDashboardData();
        window._dashboardData = dashboardData;
        if (dashboardData.account_type === "candidate") { window.location.href="/espace-formateur.html"; return; }
        const trainer = dashboardData.trainer;
        if (!trainer) throw new Error("Profil formateur introuvable.");
        await buildTrainerView(trainer, sessionEmail);
      } catch(err) {
        app.innerHTML = `<div class="alert alert-warning"><h2>Erreur</h2><p>${escapeHtml(err.message)}</p></div>`;
      }
    }


    load();
  </script>
</body>
</html>
