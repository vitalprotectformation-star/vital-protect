  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://zsraqxzneghkzaozzuci.supabase.co",
      "sb_publishable_VlTpYjzJ3DKpFA1Un_EFHQ_FW-mYK4U"
    );

    let certifiedModules = [];
    let dashboardStages = [];
    let dashboardReservations = [];
    let latestTrainerDashboard = null;

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }


    const VP_MODULE_NAMES = {
      module1: "Prévenir, éviter, réagir – Module 1",
      module2: "Prévenir, éviter, réagir – Module 2",
      pro: "Faire face aux situations tendues et comportements agressifs en milieu professionnel"
    };

    function normalizeModuleKey(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function getCanonicalModuleType(...values) {
      const text = values.map(normalizeModuleKey).filter(Boolean).join(" ");
      if (!text) return "";
      if (text.includes("niveau 2") || text.includes("niv 2") || text.includes("module 2")) return "module2";
      if (text.includes("professionnel") || text.includes("professionnelle") || text.includes("entreprise") || text.includes("salarie") || text.includes("salaries") || text.includes("equipe") || text.includes("agressif") || text.includes("agressive") || text.includes("tendu") || text.includes("tendue") || text.includes("comportement") || text.includes("self pro")) return "pro";
      if (text.includes("niveau 1") || text.includes("niv 1") || text.includes("module 1") || text.includes("self defense") || text.includes("securite personnelle") || text.includes("prevenir eviter reagir")) return "module1";
      return "";
    }

    function getCanonicalModuleName(value) {
      const type = getCanonicalModuleType(value);
      return type ? VP_MODULE_NAMES[type] : String(value || "").trim();
    }


    function getOfficialModuleName(value) {
      const type = getCanonicalModuleType(value);
      return type ? VP_MODULE_NAMES[type] : "";
    }

    function isOfficialModuleName(value) {
      return Boolean(getOfficialModuleName(value));
    }

    function pushOfficialModule(modules, value) {
      const moduleName = getOfficialModuleName(value);
      if (!moduleName) return;
      const key = normalizeModuleKey(moduleName);
      if (!modules.some(existing => normalizeModuleKey(existing) === key)) {
        modules.push(moduleName);
      }
    }

    function extractOfficialModulesFromText(value) {
      const raw = String(value || "").trim();
      if (!raw) return [];

      let items = [];
      if (raw.startsWith("[") && raw.endsWith("]")) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) items = parsed;
        } catch (_) {
          items = [];
        }
      }

      if (!items.length) {
        items = raw.split(/\s*\|\s*|\s*;\s*|\n+/g);
      }

      const modules = [];
      items.forEach(item => pushOfficialModule(modules, item));

      const normalized = normalizeModuleKey(raw);
      if (normalized.includes("module 1") || normalized.includes("niveau 1")) pushOfficialModule(modules, VP_MODULE_NAMES.module1);
      if (normalized.includes("module 2") || normalized.includes("niveau 2")) pushOfficialModule(modules, VP_MODULE_NAMES.module2);
      if (
        normalized.includes("professionnel") ||
        normalized.includes("professionnelle") ||
        normalized.includes("entreprise") ||
        normalized.includes("salarie") ||
        normalized.includes("salaries") ||
        normalized.includes("equipe") ||
        normalized.includes("agressif") ||
        normalized.includes("agressive") ||
        normalized.includes("tendu") ||
        normalized.includes("tendue") ||
        normalized.includes("comportement") ||
        normalized.includes("self pro") ||
        normalized.includes("module 3") ||
        normalized.includes("mod 3")
      ) pushOfficialModule(modules, VP_MODULE_NAMES.pro);

      return modules.slice(0, 3);
    }

    function replaceLegacyModuleNames(value) {
      let text = String(value || "").trim();
      if (!text) return "";
      text = text.replace(/Self\s*Défense\s*en\s*entreprise/gi, VP_MODULE_NAMES.pro);
      text = text.replace(/Self\s*Defense\s*en\s*entreprise/gi, VP_MODULE_NAMES.pro);
      text = text.replace(/Self\s*Pro/gi, VP_MODULE_NAMES.pro);
      text = text.replace(/Self\s*Défense\s*Essentielle\s*Niveau\s*2/gi, VP_MODULE_NAMES.module2);
      text = text.replace(/Self\s*Defense\s*Essentielle\s*Niveau\s*2/gi, VP_MODULE_NAMES.module2);
      text = text.replace(/Self\s*Défense\s*Essentielle\s*Niveau\s*1/gi, VP_MODULE_NAMES.module1);
      text = text.replace(/Self\s*Defense\s*Essentielle\s*Niveau\s*1/gi, VP_MODULE_NAMES.module1);
      text = text.replace(/Self\s*Défense\s*Essentielle/gi, VP_MODULE_NAMES.module1);
      text = text.replace(/Self\s*Defense\s*Essentielle/gi, VP_MODULE_NAMES.module1);
      return text;
    }

    function displayStageTitle(stage) {
      const moduleName = getCanonicalModuleName(stage?.training_type || stage?.title);
      const title = replaceLegacyModuleNames(stage?.title || "");
      if (title && title !== stage?.title) return title;
      if (title && normalizeModuleKey(title).includes(normalizeModuleKey(moduleName))) return title;
      return moduleName || title || "Stage";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function formatDate(dateString) {
      if (!dateString) return "—";
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleDateString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatDateTime(dateString) {
      if (!dateString) return "—";
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "—";
      return date.toLocaleString("fr-FR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatPrice(value) {
      const amount = Number(value || 0);
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR",
        maximumFractionDigits: 0
      }).format(Number.isFinite(amount) ? amount : 0);
    }

    function isPastStage(dateString) {
      if (!dateString) return false;
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      date.setHours(0, 0, 0, 0);
      return date < today;
    }

    function getStatusLabel(status) {
      const value = normalize(status || "pending");
      const labels = {
        published: "Publié",
        pending: "En attente admin",
        draft: "Brouillon",
        hidden: "Masqué",
        cancelled: "Annulé",
        completed: "Réalisé"
      };
      return labels[value] || status || "Publié";
    }

    function getStatusBadgeClass(status) {
      const value = normalize(status || "pending");
      if (value === "published" || value === "completed") return "badge-success";
      if (value === "cancelled") return "badge-danger";
      return "badge-warning";
    }

    function reservationsForStage(stageId) {
      return dashboardReservations.filter(row => row.stage_id === stageId);
    }

    function paidReservationsForStage(stageId) {
      return reservationsForStage(stageId).filter(row => normalize(row.payment_status || "paid") === "paid");
    }

    function isEnterpriseStage(stage) {
      return normalize(stage?.stage_kind || stage?.price_model) === "enterprise" || normalize(stage?.stage_kind || stage?.price_model) === "package" || Number(stage?.standard_price || 0) === 390;
    }

    function paidPlacesForStage(stageId) {
      const stage = dashboardStages.find(item => item.id === stageId);
      const reservations = paidReservationsForStage(stageId);
      if (isEnterpriseStage(stage)) return reservations.length;
      return reservations.reduce((sum, row) => sum + Number(row.places || 0), 0);
    }

    function getReservationTrainerPayout(row) {
      if (!row || row.trainer_payout_amount === null || row.trainer_payout_amount === undefined || row.trainer_payout_amount === "") {
        return null;
      }

      const amount = Number(row.trainer_payout_amount);
      return Number.isFinite(amount) ? amount : null;
    }

    function payoutSummaryForStage(stageId) {
      const stage = dashboardStages.find(item => item.id === stageId);
      const stageAmount = Number(stage?.trainer_payout_estimate);
      if (Number.isFinite(stageAmount)) {
        return { known: true, amount: stageAmount };
      }

      const reservations = paidReservationsForStage(stageId);
      if (!reservations.length) {
        return { known: true, amount: 0 };
      }

      let total = 0;
      for (const row of reservations) {
        const amount = getReservationTrainerPayout(row);
        if (amount === null) {
          return { known: false, amount: null };
        }
        total += amount;
      }

      return { known: true, amount: total };
    }


    function trainerPayoutStatusLabel(status) {
      const value = normalize(status || "scheduled");
      const labels = {
        scheduled: "Prévu",
        validated: "Validé par VITAL PROTECT",
        paid: "Payé",
        blocked: "Bloqué"
      };
      return labels[value] || status || "Prévu";
    }

    function trainerPayoutStatusClass(status) {
      const value = normalize(status || "scheduled");
      if (value === "paid") return "badge-success";
      if (value === "blocked") return "badge-danger";
      return "badge-warning";
    }

    function reservationPayoutStatus(row) {
      if (row?.trainer_payout_paid_at) return "paid";
      return normalize(row?.trainer_payout_status || "scheduled");
    }

    function aggregateTrainerPayoutStatus(reservations) {
      const rows = (reservations || []).filter(row => normalize(row.payment_status || "paid") === "paid");
      if (!rows.length) return "scheduled";
      const statuses = rows.map(reservationPayoutStatus);
      if (statuses.every(status => status === "paid")) return "paid";
      if (statuses.some(status => status === "blocked")) return "blocked";
      if (statuses.some(status => status === "validated")) return "validated";
      return "scheduled";
    }

    function buildTrainerPayoutRows() {
      return dashboardStages
        .map(stage => {
          const reservations = paidReservationsForStage(stage.id);
          const summary = payoutSummaryForStage(stage.id);
          const status = aggregateTrainerPayoutStatus(reservations);
          const dueDate = reservations.find(row => row.trainer_payout_due_date)?.trainer_payout_due_date || stage.trainer_payout_due_date;
          const paidAt = reservations.find(row => row.trainer_payout_paid_at)?.trainer_payout_paid_at || null;
          return {
            stage,
            reservations,
            summary,
            status,
            dueDate,
            paidAt
          };
        })
        .filter(row => row.reservations.length || Number(row.summary.amount || 0) > 0)
        .sort((a, b) => String(a.dueDate || "9999-12-31").localeCompare(String(b.dueDate || "9999-12-31")) || String(a.stage.stage_date || "").localeCompare(String(b.stage.stage_date || "")));
    }

      const totalUpcoming = rows

      const totalPaid = rows

        .reduce((sum, row) => sum + Number(row.summary.amount || 0), 0);

      return `

              <tbody>
                ${rows.map(row => `

                    <td><strong>${escapeHtml(displayStageTitle(row.stage))}</strong><span>${escapeHtml(row.stage.city || "—")}</span></td>
                    <td>${formatDate(row.stage.stage_date)}</td>
                    <td><strong>${formatTrainerPayout(row.summary)}</strong><span>${row.reservations.length} réservation${row.reservations.length > 1 ? "s" : ""} payée${row.reservations.length > 1 ? "s" : ""}</span></td>
                    <td>${row.status === "paid" ? formatDate(row.paidAt) : formatDate(row.dueDate)}</td>

    function formatTrainerPayout(summary) {
      if (!summary || summary.known === false || summary.amount === null || summary.amount === undefined) {
        return "À définir";
      }
      return formatPrice(summary.amount);
    }

    function getStageCapacity(stage) {
      const apiCapacity = Number(stage.inventory_capacity || 0);
      if (apiCapacity > 0) return apiCapacity;
      if (isEnterpriseStage(stage)) return Number(stage.remaining_places || 0) + paidPlacesForStage(stage.id) || 1;
      const maxParticipants = Number(stage.max_participants || 0);
      if (maxParticipants > 0) return maxParticipants;
      return Number(stage.remaining_places || 0) + paidPlacesForStage(stage.id);
    }

    function getFillPercent(stage) {
      const capacity = getStageCapacity(stage);
      if (!capacity) return 0;
      return Math.min(100, Math.round((paidPlacesForStage(stage.id) / capacity) * 100));
    }

    function isFutureOrToday(dateString) {
      if (!dateString) return false;

      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return false;

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      date.setHours(0, 0, 0, 0);
      return date >= today;
    }

    async function getTrainerAuthHeaders() {
      let {
        data: { session }
      } = await supabase.auth.getSession();

      if (!session?.access_token) {
        await new Promise(resolve => setTimeout(resolve, 500));
        const retry = await supabase.auth.getSession();
        session = retry.data.session;
      }

      const accessToken = session?.access_token || "";

      if (!accessToken) {
        throw new Error("Session formateur introuvable");
      }

      return {
        "Content-Type": "application/json",
        Authorization: `Bearer ${accessToken}`
      };
    }

    async function parseApiResponse(res) {
      const rawText = await res.text();
      let data = null;

      try {
        data = rawText ? JSON.parse(rawText) : {};
      } catch (error) {
        data = { error: rawText || `Réponse non JSON (${res.status})` };
      }

      if (!res.ok) {
        throw new Error(data?.error || `Erreur HTTP ${res.status}`);
      }

      return data;
    }

    async function loadCertifiedModules(trainer) {
      const { data: trainerModules, error } = await supabase
        .from("trainer_modules")
        .select("module_name, status, expires_at")
        .eq("trainer_id", trainer.id);

      if (error) {
        console.error("Erreur chargement trainer_modules:", error);
        return [];
      }

      const seen = new Set();
      return (trainerModules || [])
        .filter(item =>
          ["certified", "active"].includes(normalize(item.status || "certified")) &&
          isFutureOrToday(item.expires_at) &&
          isOfficialModuleName(item.module_name)
        )
        .map(item => getOfficialModuleName(item.module_name))
        .filter(moduleName => {
          const key = normalizeModuleKey(getCanonicalModuleName(moduleName));
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

        const bDate = new Date(b.stage_date || "9999-12-31").getTime();
        return aDate - bDate;
      });
    }

    function filterDashboardStages(filterValue) {
      const value = filterValue || "all";
      return sortStagesForDashboard(dashboardStages).filter(stage => {
        const status = normalize(stage.status || "pending");
        if (value === "all") return true;
        if (value === "upcoming") return !isPastStage(stage.stage_date) && status !== "cancelled";
        if (value === "past") return isPastStage(stage.stage_date);
        return status === value;
      });
    }

    function exportStageReservations(stageId) {
      const stage = dashboardStages.find(item => item.id === stageId);
      const reservations = paidReservationsForStage(stageId);

      if (!stage || !reservations.length) {
        alert("Aucun inscrit à exporter pour ce stage.");
        return;
      }

      const rows = [
        ["Stage", "Date", "Prénom", "Nom", "Email", "Téléphone", "Places", "Versement Vital Protect estimé", "Paiement", "Inscription"],
        ...reservations.map(row => [
          displayStageTitle(stage),
          formatDate(stage.stage_date),
          row.first_name || "",
          row.last_name || "",
          row.email || "",
          row.phone || "",
          row.places || 0,
          getReservationTrainerPayout(row) ?? "À définir",
          row.payment_status || "paid",
          formatDateTime(row.created_at)
        ])
      ];

      const csv = rows
        .map(cols => cols.map(value => `"${String(value).replace(/"/g, '""')}"`).join(";"))
        .join("\n");

      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `inscrits-${(displayStageTitle(stage) || "stage").toLowerCase().replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "")}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

      if (!stage || !emails.length) {
        alert("Aucun email d’inscrit disponible pour ce stage.");
        return;

      const subject = `Information stage VITAL PROTECT - ${displayStageTitle(stage) || "Stage"}`;
      const body = `Bonjour,

Nous vous contactons concernant le stage suivant :
${displayStageTitle(stage) || "Stage VITAL PROTECT"}
Date : ${formatDate(stage.stage_date)}${stage.start_time ? ` à ${stage.start_time}` : ""}
Lieu : ${stage.address || stage.city || "à confirmer"}

Cordialement,
VITAL PROTECT`;

      const mailto = `mailto:?bcc=${encodeURIComponent(emails.join(","))}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailto;

    async function updateTrainerStageStatus(stageId, status) {
      const label = status === "cancelled" ? "annuler" : "publier";
      if (!window.confirm(`Confirmer : ${label} ce stage ?`)) return;

      try {
        const headers = await getTrainerAuthHeaders();
        const res = await fetch("/api/trainer-tools", {
          method: "POST",
          headers,
          body: JSON.stringify({
            action: "update_stage_status",
            stage_id: stageId,
            status
          })
        });

        const result = await parseApiResponse(res);
        if (!result.success) {
          alert(result.error || "Mise à jour impossible.");
          return;
        }

        await refreshTrainerDashboard();
      } catch (error) {
        console.error(error);
        alert(error.message || "Erreur lors de la mise à jour du stage.");
      }
    }

    async function handleCreateStageSubmit() {
      const form = document.getElementById("createStageForm");
      const statusBox = document.getElementById("createStageStatus");

      if (!form || !statusBox) return;

      window.VP_FRANCE_LOCATION?.setupRegionDepartment({
        regionId: "stageRegion",
        departmentId: "stageDepartment",
        regionPlaceholder: "Sélectionner une région",
        departmentPlaceholder: "Sélectionner un département",
        includeAllDepartmentsWhenNoRegion: false
      });
      window.VP_FRANCE_LOCATION?.setupPostalCode("stagePostalCode");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        statusBox.style.display = "block";
        statusBox.textContent = "Création du stage en cours...";

        const trainingType = document.getElementById("stageTrainingType").value;
        const city = document.getElementById("stageCity").value.trim();
        const stageDate = document.getElementById("stageDate").value;

        if (!certifiedModules.includes(trainingType)) {
          statusBox.textContent = "Erreur : ce module n’est pas autorisé pour votre profil.";
          return;
        }

        if (!stageDate) {
          statusBox.textContent = "Erreur : veuillez choisir une date.";
          return;
        }

        const payload = {
          action: "create_stage",
          training_type: trainingType,
          description: document.getElementById("stageDescription").value.trim(),
          city,
          postal_code: document.getElementById("stagePostalCode").value.trim(),
          department: document.getElementById("stageDepartment").value.trim(),
          region: document.getElementById("stageRegion").value.trim(),
          address: document.getElementById("stageAddress").value.trim(),
          stage_date: document.getElementById("stageDate").value,
          start_time: document.getElementById("stageTime").value.trim(),
          duration: document.getElementById("stageDuration").value.trim(),
          max_participants: Number(document.getElementById("stageMaxParticipants").value || 20),
          remaining_places: Number(document.getElementById("stageRemainingPlaces").value || 20),
          // Le prix n’est pas choisi par le formateur : il est standardisé côté serveur.
        };

        try {
          const headers = await getTrainerAuthHeaders();

          const res = await fetch("/api/trainer-tools", {
            method: "POST",
            headers,
            body: JSON.stringify(payload)
          });

          const result = await parseApiResponse(res);

          if (!result.success) {
            statusBox.textContent = result.error || "Erreur lors de la création du stage.";
            return;
          }

          statusBox.textContent = `✅ ${result.message || "Stage créé et publié avec succès."} Titre généré : ${result.stage?.title || "Stage"}`;
          form.reset();
          await refreshTrainerDashboard();
        } catch (error) {
          console.error("Erreur création stage:", error);
          statusBox.textContent = `Erreur : ${escapeHtml(error.message)}`;
        }
      });
    }

    function candidateStatusLabel(candidate) {
      const payment = normalize(candidate?.payment_status || "");
      const validation = normalize(candidate?.validation_status || "pending");
      const result = normalize(candidate?.training_result || "pending");

      if (["captured", "paid"].includes(payment) && validation === "validated" && result === "passed") return "Réussi — activation à finaliser";
      if (result === "resit") return "Rattrapage à planifier";
      if (result === "failed") return "Recalé";
      if (validation === "validated") return "Dossier validé — sessions / résultat à suivre";
      if (["authorized", "captured", "paid", "checkout_created"].includes(payment)) return "Paiement enregistré — dossier à planifier";
      return "Dossier en cours";
    }

    function groupCandidateSessionsByModule(sessions = []) {
      return sessions.reduce((groups, session) => {
        const moduleName = getOfficialModuleName(session.module_name || session.training_type || session.title || "Module");
        if (!moduleName) return groups;
        if (!groups[moduleName]) groups[moduleName] = [];
        groups[moduleName].push({ ...session, module_name: moduleName, title: moduleName });
        return groups;
      }, {});
    }

    function getCandidateSessionVisual(moduleName) {
      const type = getCanonicalModuleType(moduleName);
      if (type === "pro") return "vp-exact-self-pro.png";
      return "vp-exact-prevenir-module.png";
    }

    function getCandidateModuleCardClass(moduleName) {
      const type = getCanonicalModuleType(moduleName);
      if (type === "pro") return "candidate-stage-card-pro";
      if (type === "module2") return "candidate-stage-card-module2";
      return "candidate-stage-card-module1";
    }

    function getCleanCandidateModules(candidate = {}) {
      const modules = [];
      const selected = Array.isArray(candidate.selected_modules) ? candidate.selected_modules : [];
      selected.forEach(moduleName => pushOfficialModule(modules, moduleName));

      // Sécurité : si d'anciennes données ont été découpées sur les virgules
      // (ex. "Prévenir" / "éviter" / "réagir – Module 1"), on reconstruit
      // uniquement les 3 modules officiels à partir du texte complet disponible.
      [
        selected.join(" | "),
        candidate.training_type,
        candidate.selected_module,
        candidate.message
      ].forEach(value => {
        extractOfficialModulesFromText(value).forEach(moduleName => pushOfficialModule(modules, moduleName));
      });

      return modules.slice(0, 3);
    }

    function formatCandidateDateRange(startDate, endDate) {
      const start = formatDate(startDate);
      const end = formatDate(endDate);
      if (start === "—" && end === "—") return "Date à confirmer";
      if (end === "—" || start === end) return start;
      return `${start} → ${end}`;
    }

    function attachCandidateSessionActions() {
      document.querySelectorAll(".candidate-session-prefer").forEach((button) => {
        button.addEventListener("click", async () => {
          if (button.disabled) return;

          const sessionId = button.dataset.sessionId || "";
          const label = button.dataset.sessionLabel || "session de validation";

          if (!sessionId) {
            alert("Session introuvable. Rechargez la page puis réessayez.");
            return;
          }

          if (!window.confirm(`Confirmer votre préférence pour :\n${label} ?`)) return;

          const previousText = button.textContent;
          button.disabled = true;
          button.textContent = "Enregistrement...";

          try {
            const headers = await getTrainerAuthHeaders();
            const res = await fetch("/api/trainer-tools", {
              method: "POST",
              headers,
              body: JSON.stringify({
                action: "prefer_candidate_session",
                session_id: sessionId
              })
            });

            const result = await parseApiResponse(res);
            alert(result.message || "Votre préférence de session est enregistrée.");
            await refreshTrainerDashboard();
          } catch (error) {
            console.error(error);
            alert(error.message || "Impossible d’enregistrer votre choix de session.");
            button.disabled = false;
            button.textContent = previousText;
          }
        });
      });
    }

ID formateur : ${escapeHtml(trainer.id)}
Habilitation valide : ${certValid}
Affiliation valide : ${affiliationValid}
Affiliation status : ${escapeHtml(trainer.affiliation_status || "—")}
Affiliation end : ${escapeHtml(trainer.affiliation_end || "—")}</div>
        `;

        document
          .getElementById("renewAffiliationBtn")
          .addEventListener("click", () => payAffiliation(trainer.email));

        document
          .getElementById("refreshBtn")
          .addEventListener("click", () => window.location.reload());

        attachLogoutButtons();
        return;
      }

      if (!certValid) {
        app.innerHTML = `
          <h1>Espace formateur</h1>
          <p class="muted">Bienvenue sur votre espace personnel VITAL PROTECT.</p>

          ${affiliationFeedback}

          <div class="alert alert-warning">
            <h2>Habilitation expirée</h2>
            <p>Votre affiliation est active, mais votre habilitation n’est plus valide.</p>
            <p>Vous devez suivre le parcours de renouvellement / recyclage pour retrouver un statut complet.</p>
          </div>

          <div class="grid" style="margin-top:18px;">
            <div class="info-box">
              <span class="label">Formateur</span>
              <div class="value">${escapeHtml(trainer.first_name || "")} ${escapeHtml(trainer.last_name || "")}</div>
            </div>
            <div class="info-box">
              <span class="label">Email</span>
              <div class="value">${escapeHtml(trainer.email || "—")}</div>
            </div>
            <div class="info-box">
              <span class="label">Habilitation</span>
              <div class="value"><span class="badge badge-danger">Expirée</span></div>
            </div>
            <div class="info-box">
              <span class="label">Expire le</span>
              <div class="value">${formatDate(trainer.certification_expiry)}</div>
            </div>
            <div class="info-box">
              <span class="label">Affiliation</span>
              <div class="value"><span class="badge badge-success">Active</span></div>
            </div>
            <div class="info-box">
              <span class="label">Expire le</span>
              <div class="value">${formatDate(trainer.affiliation_end)}</div>
            </div>
          </div>

          <div class="actions">
            <a href="/devenir-formateur.html" class="btn btn-primary">Voir les formations disponibles</a>
            <button id="logoutBtn" class="btn btn-secondary" type="button">Déconnexion</button>
          </div>

          <div class="debug diagnostic">Email session : ${escapeHtml(sessionEmail)}
Email trouvé : ${trainer.email}
ID formateur : ${escapeHtml(trainer.id)}
Habilitation valide : ${certValid}
Affiliation valide : ${affiliationValid}
Date fin habilitation : ${escapeHtml(trainer.certification_expiry || "—")}</div>
        `;

        attachLogoutButtons();
        return;
      }

      await renderFullActiveView(trainer, sessionEmail, certValid, affiliationValid);
    }

    async function load() {
      const app = document.getElementById("app");

      let {
        data: { session }
      } = await supabase.auth.getSession();

      if (!session?.user?.email) {
        await new Promise(resolve => setTimeout(resolve, 1000));
        const retry = await supabase.auth.getSession();
        session = retry.data.session;
      }

      if (!session?.user?.email) {
        (window.VitalPageTransition ? window.VitalPageTransition.go("/formateur-login.html") : (window.location.href = "/formateur-login.html"));
        return;
      }

      const sessionEmail = session.user.email.trim().toLowerCase();

      try {
        const dashboardData = await loadTrainerDashboardData();

        if (dashboardData.account_type === "candidate") {
          renderCandidateDashboard(dashboardData, sessionEmail);
          return;
        }

        const trainer = dashboardData.trainer;

        if (!trainer) {
          throw new Error("Profil formateur introuvable dans la réponse dashboard.");
        }

        certifiedModules = await loadCertifiedModules(trainer);
        await buildTrainerView(trainer, sessionEmail);
      } catch (error) {
        console.error("Erreur chargement dashboard formateur:", error);
        await supabase.auth.signOut();
        app.innerHTML = `
          <h1>Dashboard formateur indisponible</h1>
          <p class="muted">Impossible de charger votre dashboard formateur.</p>
          <div class="alert alert-warning">${escapeHtml(error.message || "Erreur inconnue")}</div>
          <div class="actions">
            <a href="/formateur-login.html" class="btn btn-primary">Retour connexion</a>
            <a href="/" class="btn btn-secondary">Retour au site</a>
          </div>
        `;
        attachLogoutButtons();
      }
    }


    document.getElementById("headerLogoutBtn").addEventListener("click", logoutTrainer);

    load();
  </script>
</body>
</html>
