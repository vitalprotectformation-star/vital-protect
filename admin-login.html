<!DOCTYPE html>
<html lang="fr">
<head>

  <script>
    (function () {
      try {
        if (sessionStorage.getItem('vpl-route-transition-next') !== '1') return;
        var root = document.documentElement;
        var origin = JSON.parse(sessionStorage.getItem('vpl-route-transition-origin') || '{}');
        if (Number.isFinite(origin.x)) root.style.setProperty('--vpl-transition-x', (Math.max(0, Math.min(1, origin.x)) * 100) + '%');
        if (Number.isFinite(origin.y)) root.style.setProperty('--vpl-transition-y', (Math.max(0, Math.min(1, origin.y)) * 100) + '%');
        root.classList.add('vpl-route-preload-transition');
      } catch (_) {}
    })();
  </script>
  <style>
    html{--vpl-transition-image:url("transition-screen.png");--vpl-transition-bg-size:cover}
    html.vpl-route-preload-transition,html.vpl-route-preload-transition body{background:#2f6f9f!important}
    html.vpl-route-preload-transition::before{content:"";position:fixed;inset:0;z-index:2147482998;pointer-events:none;background-color:#2f6f9f;background-image:var(--vpl-transition-image);background-position:center;background-size:var(--vpl-transition-bg-size);background-repeat:no-repeat;opacity:1}
    @media (max-width: 768px), (pointer: coarse) and (orientation: portrait){html{--vpl-transition-image:url("transition-screen-mobile.jpg");--vpl-transition-bg-size:cover}}
  </style>
  <link rel="preload" as="image" href="transition-screen.png" media="(min-width: 769px)" />
  <link rel="preload" as="image" href="transition-screen-mobile.jpg" media="(max-width: 768px), (pointer: coarse) and (orientation: portrait)" />
  <script src="/page-transition.js"></script>
  <script>
    if (!window.VitalPageTransition) {
      document.write('<script src="page-transition.js"><\/script>');
    }
  </script>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Admin — VITAL PROTECT</title>

  <style>
    :root {
      --navy: #0b2e59;
      --navy-dark: #08203d;
      --blue: #1f6feb;
      --bg: #f4f7fb;
      --card: #ffffff;
      --border: #dbe4f0;
      --text: #142033;
      --muted: #667085;
      --shadow: 0 10px 30px rgba(11, 46, 89, 0.08);
      --success: #0f9d58;
      --danger: #c62828;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .logo {
      margin-bottom: 24px;
    }

    .logo img {
      width: min(260px, 60vw);
      height: auto;
      display: block;
    }

    .card {
      width: min(480px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: var(--blue);
      color: white;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .status {
      margin-top: 14px;
      min-height: 22px;
      line-height: 1.5;
      color: var(--muted);
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .footer-link {
      margin-top: 16px;
      text-align: center;
    }

    .footer-link a {
      color: var(--navy);
      text-decoration: none;
      font-weight: 700;
    }
  

    /* Mobile hardening login */
    @media (max-width: 480px) {
      body { padding: 18px; justify-content: flex-start; padding-top: 42px; }
      .logo { margin-bottom: 18px; }
      .logo img { width: min(190px, 58vw); }
      .card { padding: 22px; border-radius: 20px; }
      h1 { font-size: 1.55rem; line-height: 1.15; }
      input { font-size: 16px; }
      .btn { min-height: 46px; }
    }
</style>
</head>

<body>
  <div class="logo">
    <img src="/logo.png" alt="VITAL PROTECT" />
  </div>

  <div class="card">
    <h1>Connexion admin</h1>
    <p>Accédez au cockpit VITAL PROTECT avec votre email autorisé et votre mot de passe. Aucun email de connexion n’est envoyé.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email admin</label>
        <input
          type="email"
          id="email"
          required
          placeholder="admin@vital-protect.fr"
          autocomplete="email"
        />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          required
          placeholder="Votre mot de passe"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Se connecter
      </button>
    </form>

    <div class="footer-link">
      <a href="/mot-de-passe-oublie.html?type=admin">Mot de passe oublié ?</a>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://zsraqxzneghkzaozzuci.supabase.co",
      "sb_publishable_VlTpYjzJ3DKpFA1Un_EFHQ_FW-mYK4U"
    );

    const form = document.getElementById("loginForm");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = `status${type ? " " + type : ""}`;
    }

    async function checkAdminAccess(email) {
      const { data: adminUser, error } = await supabase
        .from("admin_users")
        .select("id, email")
        .eq("email", email)
        .maybeSingle();

      if (error) {
        throw new Error(error.message || "Erreur lors de la vérification admin.");
      }

      return Boolean(adminUser);
    }

    async function checkExistingSession() {
      const {
        data: { session }
      } = await supabase.auth.getSession();

      const email = session?.user?.email?.trim().toLowerCase();
      if (!email) return;

      try {
        const allowed = await checkAdminAccess(email);
        if (allowed) {
          (window.VitalPageTransition ? window.VitalPageTransition.go("/admin.html") : (window.location.href = "/admin.html"));
        } else {
          await supabase.auth.signOut();
        }
      } catch (error) {
        console.error("Erreur vérification session admin:", error);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        setStatus("Veuillez saisir votre email et votre mot de passe.", "error");
        return;
      }

      submitBtn.disabled = true;
      setStatus("Connexion en cours...");

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          console.error("Erreur connexion admin:", error);
          setStatus("Email ou mot de passe incorrect.", "error");
          return;
        }

        const allowed = await checkAdminAccess(email);

        if (!allowed) {
          await supabase.auth.signOut();
          setStatus("Accès refusé : cet email n’est pas autorisé comme admin.", "error");
          return;
        }

        setStatus("✅ Connexion validée. Redirection...", "success");
        form.reset();

        setTimeout(() => {
          (window.VitalPageTransition ? window.VitalPageTransition.go("/admin.html") : (window.location.href = "/admin.html"));
        }, 450);
      } catch (error) {
        console.error("Erreur login admin:", error);
        setStatus(error.message || "Erreur réseau ou serveur.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    });

    checkExistingSession();
  </script>
</body>
</html>
